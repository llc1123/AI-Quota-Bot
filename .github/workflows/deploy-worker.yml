name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - wrangler.jsonc
      - worker-configuration.d.ts
      - vite.config.ts
      - vitest.config.ts
      - tsconfig.json
      - biome.jsonc
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Worker
        run: npm run check

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
