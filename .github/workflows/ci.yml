name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check Worker and relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create type-generation dev vars
        run: |
          cp .dev.vars.example .dev.vars
          cat >> .dev.vars <<'EOF'
          CODEX_USAGE_RELAY_URL="https://relay.example/wham/usage"
          CODEX_USAGE_RELAY_TOKEN="dummy-relay-token"
          EOF

      - name: Check Worker
        run: npm run check

      - name: Compile relay
        run: python -m py_compile relay/codex_usage_relay.py

      - name: Build relay image
        run: docker build -t codex-usage-relay:ci relay
