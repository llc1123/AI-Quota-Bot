name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Check Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Worker
        run: npm run check
