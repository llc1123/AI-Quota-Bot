name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Check Worker and relay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Worker
        run: npm run check

      - name: Compile relay
        run: python -m py_compile relay/codex_usage_relay.py

      - name: Test relay
        run: python -m unittest discover -s relay -p 'test_*.py'

      - name: Build relay image
        run: docker build -t codex-usage-relay:ci relay
